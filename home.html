<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yeni Sekme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #121212;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center; /* Tam ortaya kilitler */
      align-items: center;     /* Yatayda ortalar */
      height: 100vh;
      overflow: hidden;
    }

    /* İşte o gurme dokunuş: Tam ortadan biraz yukarı kaydıran sihirli kod */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-50px); 
    }

    h1 { font-size: 2.5rem; margin-bottom: 8px; color: #4CAF50; }
    p { color: #aaa; margin-bottom: 25px; font-size: 14px; }

    .search-box {
      display: flex;
      width: 500px;
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 30px;
      padding: 12px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .quick-links {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .shortcut {
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 8px 18px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .shortcut:hover { background: #333; border-color: #555; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Benim Tarayıcım</h1>
    <p>Hafif, bağımsız ve tamamen senin kontrolünde!</p>

    <div class="search-box">
      <input type="text" id="homeInput" class="search-input" placeholder="Google'da ara veya adres yaz..." onkeydown="handleSearch(event)">
    </div>

    <div class="quick-links">
      <a class="shortcut" href="https://www.google.com" onclick="goSite(event, 'https://www.google.com')">Google</a>
      <a class="shortcut" href="https://www.youtube.com" onclick="goSite(event, 'https://www.youtube.com')">YouTube</a>
      <a class="shortcut" href="https://tr.wikipedia.org" onclick="goSite(event, 'https://tr.wikipedia.org')">Wikipedia</a>
      <a class="shortcut" href="https://github.com" onclick="goSite(event, 'https://github.com')">GitHub</a>
    </div>
  </div>

  <script>
    function handleSearch(e) {
      if (e.key === 'Enter') {
        let val = e.target.value.trim();
        if (!val) return;
        let targetUrl = val.startsWith('http') ? val : 'https://www.google.com/search?q=' + encodeURIComponent(val);
        window.location.href = targetUrl;
      }
    }
    function goSite(e, url) {
      e.preventDefault();
      window.location.href = url;
    }
  </script>

</body>
</html>
